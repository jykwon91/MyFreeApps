[project]
name = "mylanguagetutor-backend"
version = "0.1.0"
description = "MyLanguageTutor backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "anthropic==1.8.0",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "fastapi-users[sqlalchemy]==15.0.5",
    "pyjwt[crypto]==2.15.1",
    "passlib[bcrypt]==1.7.4",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "anyio==4.16.0",
    "minio==7.2.20",
    "platform-shared",
    "pyotp==2.10.0",
    "qrcode[pil]==8.2",
]

[tool.uv]
package = false

[tool.uv.sources]
platform-shared = { path = "../../../packages/shared-backend", editable = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-timeout==2.4.0",
]
