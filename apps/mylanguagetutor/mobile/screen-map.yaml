routes:
  # The website sends / on to /scenarios, or to onboarding before a language and level are picked;
  # the app opens on its Practice tab, which does the same.
  /:
    screen: (app)/(tabs)/index
  /forgot-password:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  /login:
    screen: sign-in
  # Opened over the Practice tab by its profile gate, before a learner has picked a language.
  /onboarding/language:
    screen: (app)/onboarding/language
  # The language step's next step, and the scenario list's Change level.
  /onboarding/level:
    screen: (app)/onboarding/level
  # A typed conversation, opened from a scenario on the Practice tab.
  /practice:
    screen: (app)/practice
  /register:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  /reset-password:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  # The Practice tab. A scenario opens /practice.
  /scenarios:
    screen: (app)/(tabs)/index
  # In Settings. Its Turn on dialog is a screen of its own, (app)/security/turn-on; the Turn off dialog is a
  # sheet; the export downloads to the share sheet; Delete account opens (app)/delete-account.
  /security:
    screen: (app)/security/index
  /settings:
    screen: (app)/(tabs)/settings
  /support-myfreeapps:
    not_on_mobile: Opens on the website.
  /verify-email:
    not_on_mobile: Done on the website, which the sign-in screen links to.
