app_slug: mylanguagetutor
app_display_name: MyLanguageTutor
api_port: 8010
caddy_host_port: 8102
node_version: '20'
postgres_image: postgres:16
has_minio_subdomain: false
joins_minio_network: true
block_api_docs: false
include_bundle_tripwire: false
# Manual-dispatch-only until the voice UI (PR 4) makes the app usable. Flip to
# true + re-render + drop from _NO_AUTO_DEPLOY in test_app_conformance.py.
automated_deploy: false
registry_images: true
serve_only_build_arg: false
# Voice-first tutor: the page itself needs getUserMedia for the microphone.
permissions_policy_self:
- microphone
env_seed_command: seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend
  python3 -m platform_shared.infra.seed_env --app mylanguagetutor'
csp: 'default-src ''self''; script-src ''self'' https://challenges.cloudflare.com;
  style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:; font-src ''self'';
  connect-src ''self'' https://challenges.cloudflare.com; frame-src ''self'' https://challenges.cloudflare.com
  https://www.youtube-nocookie.com; frame-ancestors ''none''; base-uri ''self''; form-action
  ''self''; object-src ''none''; upgrade-insecure-requests'
workers: []
post_deploy_commands: []
