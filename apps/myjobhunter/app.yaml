app_slug: myjobhunter
app_display_name: MyJobHunter
api_port: 8002
caddy_host_port: 8092
node_version: "20"
postgres_image: pgvector/pgvector:pg16
has_minio_subdomain: false
joins_minio_network: true
block_api_docs: false
include_bundle_tripwire: true
# Push to main auto-deploys this app. Set false to make it manual-dispatch-only.
automated_deploy: true
# On-VPS Docker build (legacy path). Flip to true to build in CI + pull from
# GHCR (needs GHCR_PULL_TOKEN secret + MYJOBHUNTER_VITE_TURNSTILE_SITE_KEY var).
# See apps/mybookkeeper/app.yaml — mbk is the first app on the registry path.
registry_images: true
# Fully auth-gated app — no serve-only public-library mode. Keeps the
# VITE_SERVE_ONLY build-arg chain OUT of the rendered docker files (MGA-only).
serve_only_build_arg: false
env_seed_command: seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend
  python3 -m platform_shared.infra.seed_env --app myjobhunter'
# script-src hash = the inline theme-bootstrap <script> in frontend/index.html
# (LF bytes, as CI builds it; byte-identical in every app but MGA). Editing that
# script means regenerating the hash — rules/inline-script-csp-hashes.md;
# test_inline_script_csp_hashes.py checks it.
csp: "default-src 'self'; script-src 'self' 'sha256-pRmp+e9Kbp/gMfqkTunUSwQiXg5fOIUXX1ZIdhOiwW8=' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
# api drains tracked background tasks at shutdown; renders api stop_grace_period.
drain_on_shutdown: true
workers:
  - name: resume-parser
    command: ["python", "-m", "app.workers.resume_parser_worker"]
    # Loads the fastembed MiniLM model + onnxruntime at boot to refresh the
    # profile embedding after a parse — the same model the scheduler holds
    # (measured ~320-390MB RSS after load there), on top of PDF/DOCX text
    # extraction. Sized like the scheduler; the 512m default would be ~75% full
    # before the first parse.
    mem_limit: 768m
    # On SIGTERM the worker finishes the step it is on and starts no other.
    # A parse is one Claude call (120s timeout, no SDK retries) plus a MinIO
    # download and a few DB writes; compose's 10s default would kill it
    # mid-parse and leave the job in `processing`. A parse waiting out a
    # Claude rate limit, or a refinement prepare, can run longer and is then
    # killed mid-step; the next boot puts it back on the queue
    # (app/workers/interrupted_work_recovery.py).
    stop_grace_period: 150s
    # Liveness only: the worker's heartbeat stays fresh while the process and
    # its event loop are alive (app/core/resume_worker_constants.py).
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.resume_parser_healthcheck"]
  # The ONLY process that runs the discovery APScheduler (the api's two uvicorn
  # workers must not — see app/workers/discovery_scheduler_worker.py). Exactly
  # one replica: never scale this service.
  - name: scheduler
    command: ["python", "-m", "app.workers.discovery_scheduler_worker"]
    # Holds the fastembed MiniLM model + onnxruntime and runs fetch/embed/score.
    # Measured peak RSS ~425MB (boot + a scheduled pass embedding 50 postings);
    # 768m leaves ~1.8x headroom. The 512m worker default would be ~83% full.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.discovery_scheduler_healthcheck"]
# No app-specific post-deploy steps — deploy runs migrate only.
post_deploy_commands: []
mobile: true
