routes:
  # The website sends / on to /dashboard; the app opens on its Dashboard tab.
  /:
    screen: (app)/(tabs)/index
  # On More rather than a tab: the website's own phone tab bar leaves it out too. The Dashboard's
  # empty board opens it as well.
  /analyze:
    screen: (app)/analyze
  # The website adds an application in a dialog on this page; the app adds it on (app)/applications/new.
  /applications:
    screen: (app)/(tabs)/applications
  /applications/:id:
    screen: (app)/applications/[id]
  # On More rather than a tab: the website's own phone tab bar leaves it out too. Its Add company
  # dialog is a sheet on this screen.
  /companies:
    screen: (app)/companies/index
  /companies/:id:
    screen: (app)/companies/[id]
  # The board's drag and drop is a Move button on each card; its drawer is the application's screen.
  /dashboard:
    screen: (app)/(tabs)/index
  # On More rather than a tab: the website's own phone tab bar leaves it out too. Its new and edit
  # saved-search dialogs are one sheet; the source filter, refresh frequency and dismiss reason are
  # choice sheets; Undo is on the toast; the profile reminder's link opens the website's profile.
  /discover:
    screen: (app)/discover
  # On More rather than a tab: the website's own phone tab bar leaves it out too. Its Add document
  # dialog is two sheets on this screen, Upload a file and Write a document.
  /documents:
    screen: (app)/documents
  /forgot-password:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  /login:
    screen: sign-in
  /profile:
    not_on_mobile: Not built yet.
  /register:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  /reset-password:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  /resume:
    not_on_mobile: Not built yet.
  /security:
    not_on_mobile: Not built yet.
  /settings:
    screen: (app)/(tabs)/more
  /support-myfreeapps:
    not_on_mobile: Opens on the website.
  /verify-email:
    not_on_mobile: Done on the website, which the sign-in screen links to.
  ADMIN_ROUTES.DASHBOARD:
    not_on_mobile: Operator dashboards, for the website.
  ADMIN_ROUTES.DEMO_USERS:
    not_on_mobile: Operator dashboards, for the website.
  ADMIN_ROUTES.INVITES:
    not_on_mobile: Operator dashboards, for the website.
