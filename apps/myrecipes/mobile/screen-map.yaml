routes:
  /:
    screen: (tabs)/index
  # Signed in only, as on the website. Opening a result pushes discover/[id], which the website
  # shows in place on /discover rather than as a route of its own.
  /discover:
    screen: (tabs)/discover
  /forgot-password:
    not_on_mobile: Opened from the link in the verification email, which goes to the website. Sign-in can resend that email.
  /login:
    screen: sign-in
  # The owner's cook log and its "I made it" dialog (a sheet) are on the recipe screen, as on the website.
  /recipes/:id:
    screen: recipes/[id]
  # Owner only, opened from the recipe's "Tweak this recipe" button, as on the website.
  /recipes/:id/tweak:
    screen: recipes/[id]/tweak
  # Opened from the recipe's Version history (recipes/[id]/versions, which the website shows on the
  # recipe page itself): tap a version for its changes, or pick two to compare.
  /recipes/:id/versions/:vid/diff:
    screen: recipes/[id]/versions/[vid]/diff
  /recipes/import:
    screen: recipes/import
  /recipes/new:
    screen: recipes/new
  /register:
    not_on_mobile: Opened from the link in the verification email, which goes to the website. Sign-in can resend that email.
  /reset-password:
    not_on_mobile: Opened from the link in the verification email, which goes to the website. Sign-in can resend that email.
  # In Settings, when signed in. Its Turn on dialog is a screen of its own, security/turn-on; the Turn off
  # dialog is a sheet; the export downloads to the share sheet; Delete account opens delete-account.
  /security:
    screen: security/index
  /settings:
    screen: (tabs)/settings
  /support-myfreeapps:
    not_on_mobile: Opens on the website.
  /verify-email:
    not_on_mobile: Opened from the link in the verification email, which goes to the website. Sign-in can resend that email.
