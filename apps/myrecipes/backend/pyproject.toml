[project]
name = "myrecipes-backend"
version = "0.1.0"
description = "MyRecipes backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "fastapi-users[sqlalchemy]==15.0.5",
    "pyjwt[crypto]==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "anyio==4.14.2",
    "minio==7.2.20",
    # AI photo import: Claude vision extraction (consumed via platform_shared.extraction)
    "anthropic==0.122.0",
    # Downscale/normalize uploaded photos to Anthropic's vision target before send
    "pillow==12.3.0",
    "platform-shared",
    # Sentry -- fail-loud production enforcement. See app/core/observability.py.
    "sentry-sdk[fastapi]==2.68.0",
    "pyotp==2.10.0",
    "qrcode[pil]==8.2",
]

[tool.uv]
package = false

[tool.uv.sources]
platform-shared = { path = "../../../packages/shared-backend", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
]
