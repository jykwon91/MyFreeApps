[project]
name = "mygamingassistant-backend"
version = "0.1.0"
description = "MyGamingAssistant backend — personal utility lineup library for tactical FPS games"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "fastapi-users[sqlalchemy]==15.0.5",
    "pyjwt[crypto]==2.15.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "anyio==4.15.1",
    "minio==7.2.20",
    "platform-shared",
    "anthropic>=0.49.0",
    "pyotp==2.10.0",
    "qrcode[pil]==8.2",
    # YouTube ingestion — yt-dlp for video/playlist metadata + download.
    # Pinned to latest stable as of 2026-05. Bump on yt-dlp breakage (expected ~3-4x/year).
    "yt-dlp==2026.8.19",
    # APScheduler — in-process background cron for source syncs (PR 6+).
    # 3.x series; 4.x is a rewrite with breaking API changes — stay on 3.x.
    "apscheduler==3.11.3",
    # IANA timezone database for zoneinfo — the Discord raid bot resolves
    # guild timezones; python:slim images don't guarantee /usr/share/zoneinfo.
    "tzdata==2026.4",
]

[tool.uv]
package = false

[tool.uv.sources]
platform-shared = { path = "../../../packages/shared-backend", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    # World Map walk-graph generator (scripts/wow_world_map/walk/) — an
    # offline build tool, never imported by the app, so dev-only.
    "numpy==2.5.3",
]

