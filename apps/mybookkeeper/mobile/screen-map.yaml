  /terms:
    not_on_mobile: Opens on the website.
  # Adding by hand is (app)/transactions/new and import is (app)/transactions/import;
  # bulk approve and delete, a custom date range, sorting, the tax filter and export
  # are on the Money tab; vendor rules are (app)/vendor-rules; the duplicates tab is
  # (app)/duplicates/index, opened from the Money tab and Home.
  /transactions:
    screen: (app)/(tabs)/money
  /user-activity:
    not_on_mobile: Operator dashboards, for the website.
  /utility-plans:
    screen: (app)/utility-plans/index
  /vendors:
    screen: (app)/vendors/index
  # Adding is (app)/vendors/new and changing one is (app)/vendors/[id]/edit, both
  # opened from these screens. The web page has them as side panels. Rows carry the
  # hourly rate and when the vendor was last used, as the web rows do.
  /vendors/:vendorId:
    screen: (app)/vendors/[id]/index
  /verify-email:
    not_on_mobile: Opened from the link in the verification email, which goes to the website. Sign-in can resend that email.
  /welcome-manuals:
    screen: (app)/welcome-manuals/index
  # Adding is (app)/welcome-manuals/new. A manual opens as a short summary with a row
  # for each part: sections (and in them label and value pairs and photos), rooms,
  # where to eat, share, preview and email. The web page has all of it on one screen.
  /welcome-manuals/:manualId:
    screen: (app)/welcome-manuals/[id]/index
