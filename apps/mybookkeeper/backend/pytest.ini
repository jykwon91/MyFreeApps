[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: marks tests that call real external APIs (skipped in offline CI with -m "not integration")
# An un-awaited coroutine is a call that silently never ran (e.g. a storage
# call made async without updating its caller). Fail the test instead of warning.
filterwarnings =
    error:coroutine .* was never awaited:RuntimeWarning
