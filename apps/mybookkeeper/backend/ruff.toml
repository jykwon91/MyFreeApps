# Ruff settings for the MyBookkeeper backend. CI runs `ruff check --select F,E9`
# (see .github/workflows/ci-python-lint.yml).

[lint.per-file-ignores]
# These test modules import pytest fixtures from a sibling support module and
# then request them by name as test parameters; Ruff reads each parameter as a
# redefinition of the import (F811). Only these files are exempt, so a genuinely
# shadowed definition anywhere else still fails the gate.
