app_slug: mypizzatracker
app_display_name: MyPizzaTracker
api_port: 8006
caddy_host_port: 8098
node_version: '20'
postgres_image: postgres:16
has_minio_subdomain: false
joins_minio_network: true
block_api_docs: false
include_bundle_tripwire: false
# Manual-dispatch-only: no push-triggered auto-deploy. Not deployed until
# converted to a mobile app. Flip to true + re-render to re-enable auto-deploy.
automated_deploy: false
# On-VPS Docker build (legacy path). Flip to true to build in CI + pull from
# GHCR (needs GHCR_PULL_TOKEN secret + MYPIZZATRACKER_VITE_TURNSTILE_SITE_KEY var).
# See apps/mybookkeeper/app.yaml — mbk is the first app on the registry path.
registry_images: true
# Fully auth-gated app — no serve-only public-library mode. Keeps the
# VITE_SERVE_ONLY build-arg chain OUT of the rendered docker files (MGA-only).
serve_only_build_arg: false
env_seed_command: seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend
  python3 -m platform_shared.infra.seed_env --app mypizzatracker'
# script-src hash = the inline theme-bootstrap <script> in frontend/index.html
# (LF bytes, as CI builds it; byte-identical in every app but MGA). Editing that
# script means regenerating the hash — rules/inline-script-csp-hashes.md;
# test_inline_script_csp_hashes.py checks it.
csp: 'default-src ''self''; script-src ''self'' ''sha256-pRmp+e9Kbp/gMfqkTunUSwQiXg5fOIUXX1ZIdhOiwW8='' https://challenges.cloudflare.com;
  style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:; font-src ''self'';
  connect-src ''self'' https://challenges.cloudflare.com; frame-src ''self'' https://challenges.cloudflare.com https://www.youtube-nocookie.com;
  frame-ancestors ''none''; base-uri ''self''; form-action ''self''; object-src ''none'';
  upgrade-insecure-requests'
# api drains tracked background tasks at shutdown; renders api stop_grace_period.
drain_on_shutdown: true
workers: []
# No app-specific post-deploy steps — deploy runs migrate only.
post_deploy_commands: []
