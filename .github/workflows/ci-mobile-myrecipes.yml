      - 'packages/shared-mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/_mobile-checks.yml'
      - '.github/workflows/ci-mobile-myrecipes.yml'
  push:
    branches: [main]
    paths:
      - 'apps/myrecipes/mobile/**'
      - 'apps/myrecipes/api-client/**'
      - 'packages/shared-core/**'
      - 'packages/shared-mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/_mobile-checks.yml'
      - '.github/workflows/ci-mobile-myrecipes.yml'

permissions:
  contents: read

concurrency:
  group: ci-mobile-myrecipes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    name: mobile-checks / myrecipes
    uses: ./.github/workflows/_mobile-checks.yml
    with:
      project: apps/myrecipes/mobile
      expo-app: true
