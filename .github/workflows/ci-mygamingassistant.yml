name: MyGamingAssistant CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mygamingassistant/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-mygamingassistant.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mygamingassistant/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-mygamingassistant.yml'

permissions:
  contents: read

concurrency:
  group: ci-mygamingassistant-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-deps-resolve:
    name: backend-deps-resolve / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/mygamingassistant/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify lockfile is consistent with pyproject.toml
        working-directory: apps/mygamingassistant/backend
        run: uv lock --check

      - name: Sync backend dependencies from lockfile
        working-directory: apps/mygamingassistant/backend
        run: uv sync --frozen

  backend-tests:
    name: backend-tests / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Stock postgres:16 — MGA does NOT use pgvector (no embedding columns).
        # Mirrors apps/mygamingassistant/docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/test
      SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
      ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
      # MGA-specific — classifier + scheduler are disabled in CI so the
      # ANTHROPIC_API_KEY + APScheduler boot guards don't fire.
      ANTHROPIC_API_KEY: sk-ant-placeholder-not-real
      ENABLE_CLASSIFIER: "false"
      SCHEDULER_ENABLED: "false"
      WOW_PRICE_REFRESH_ENABLED: "false"
      WOW_SERVER_STATUS_RECORDING_ENABLED: "false"
      # Environment kept at default ("development") so the production boot
      # guards (seed user, classifier, scheduler) stay off.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/mygamingassistant/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync backend dependencies (incl. dev group)
        # The `dev` dependency-group in pyproject.toml carries pytest +
        # pytest-asyncio + pytest-timeout. ``uv sync --frozen --group dev``
        # installs both runtime deps and dev tools from the lockfile.
        working-directory: apps/mygamingassistant/backend
        run: uv sync --frozen --group dev

      - name: Run alembic migrations
        working-directory: apps/mygamingassistant/backend
        run: PYTHONPATH=. uv run alembic upgrade head

      - name: Run pytest
        working-directory: apps/mygamingassistant/backend
        # PYTHONPATH=. so pytest can import `app` — uv's venv-aware `uv run`
        # doesn't add CWD to sys.path the way `python -m pytest` would, and
        # this project is `package = false` (no installed entry point).
        # Same shape as the alembic step above.
        # --timeout=60 (pytest-timeout) is a safety net so a future teardown
        # bug can't consume the whole job timeout silently.
        run: PYTHONPATH=. uv run pytest -q --timeout=60

  frontend-lint:
    name: frontend-lint / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        # Use `npm install` rather than `npm ci`: there is a known npm bug
        # (https://github.com/npm/cli/issues/4828) where workspace + optional
        # platform-specific deps (rollup, esbuild) interact badly with `npm ci`'s
        # strict lockfile validation, producing
        # `Cannot find module '@rollup/rollup-linux-x64-gnu'` failures even when
        # the lockfile has the entry. `npm install` is more lenient + self-heals.
        run: npm install

      - name: Lint frontend
        run: npm run lint --workspace=mygamingassistant-frontend

      # On a clean checkout, before any build: the build compiles the
      # tsconfig.node.json project first, so it can't catch a typecheck that
      # only works once that output exists.
      - name: Typecheck frontend
        run: npm run typecheck --workspace=mygamingassistant-frontend

      - name: Typecheck E2E tests
        # The build only typechecks src/, and Playwright runs TS unchecked.
        run: npm run typecheck:e2e --workspace=mygamingassistant-frontend

  frontend-test:
    name: frontend-test / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # npm install, not npm ci — same reason as frontend-lint above.
        run: npm install

      - name: Run frontend unit tests
        run: npm test --workspace=mygamingassistant-frontend

  frontend-build:
    name: frontend-build / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        # Use `npm install` rather than `npm ci`: there is a known npm bug
        # (https://github.com/npm/cli/issues/4828) where workspace + optional
        # platform-specific deps (rollup, esbuild) interact badly with `npm ci`'s
        # strict lockfile validation, producing
        # `Cannot find module '@rollup/rollup-linux-x64-gnu'` failures even when
        # the lockfile has the entry. `npm install` is more lenient + self-heals.
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=mygamingassistant-frontend

  frontend-layout-e2e:
    name: frontend-layout-e2e / mygamingassistant / shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The mocked suite is ~440 tests and took 16-20 minutes on one runner, so a
    # slow runner hit the timeout. Two shards halve it; each shard runs half
    # the mocked specs, and the small serve-only suite runs on shard 1.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Mocked specs in e2e/mocked/ and e2e/mocked-serve-only/ answer every API
    # call via page.route(); no backend is started. The serve-only ones need a
    # dev server built with VITE_SERVE_ONLY, so they have a config of their own.
    # The full-stack specs elsewhere in e2e/ need a live backend and are not
    # run here (both e2e/ configs ignore the mocked folders).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/mygamingassistant/frontend
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Run mocked E2E tests (no backend)
        working-directory: apps/mygamingassistant/frontend
        run: npx playwright test --config=playwright.layout.config.ts --shard=${{ matrix.shard }}/2

      - name: Run serve-only mocked E2E tests (no backend)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/mygamingassistant/frontend
        run: npx playwright test --config=playwright.layout.serve-only.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/mygamingassistant/frontend/e2e/test-results-mocked/
            apps/mygamingassistant/frontend/e2e/test-results-mocked-serve-only/
          retention-days: 7

  caddy-image:
    name: caddy-image / mygamingassistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build caddy image (bakes frontend dist in)
        run: |
          docker build \
            -f apps/mygamingassistant/docker/caddy.Dockerfile \
            -t mygamingassistant-caddy:ci \
            .

      - name: Verify frontend dist is baked into image
        # Confirms the multi-stage build produced /srv/frontend/index.html
        # inside the caddy image. If this fails, the bake step silently didn't
        # copy the dist (wrong COPY path, wrong build stage, etc.).
        run: docker run --rm mygamingassistant-caddy:ci test -f /srv/frontend/index.html
