name: Mobile Sync

# A PR that edits a web app must change its mobile app too, or say why not. See
# platform_shared/infra/mobile_sync.py. `edited` is there so that adding the line to the
# description reruns this. No `paths:` filter, so it can become a required check without
# hanging on PRs it has nothing to say about.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: mobile-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-sync:
    name: mobile-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout is GitHub's merge commit, so HEAD^1 is the tip of main and the
          # diff below is exactly what this PR would change.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install jinja2 pyyaml

      - name: Check web edits have a mobile decision
        # `shell: bash` turns on pipefail, so a failed diff fails the step instead of
        # looking like a PR that changed nothing.
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff -z --name-only --no-renames HEAD^1 HEAD \
            | (cd packages/shared-backend && python -m platform_shared.infra.mobile_sync)
