name: CodeQL

on:
  # Full scans (both languages) on every push to main and weekly.
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  # Pull requests call this from ci.yml with only the languages whose files changed.
  workflow_call:
    inputs:
      languages:
        description: JSON array of the CodeQL languages to analyze.
        required: false
        type: string
        default: '["python","javascript-typescript"]'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # `inputs` is empty on push and schedule runs, which scan both languages.
        language: ${{ fromJSON(inputs.languages || '["python","javascript-typescript"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
