name: MyJobHunter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/myjobhunter/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-myjobhunter.yml'

permissions:
  contents: read

concurrency:
  group: ci-myjobhunter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filtering lives HERE, at the job level — NOT in `on.pull_request.paths`.
  #
  # Several of this workflow's checks are REQUIRED status checks on main. A
  # `pull_request` workflow skipped by a top-level `paths:` filter never reports
  # its check contexts at all, so every PR that did not touch myjobhunter hung forever
  # on "Expected — Waiting for status to be reported" and could only be landed
  # with `gh pr merge --admin`. (Same failure mode documented at length in
  # ci-shared-backend.yml, which solves it by always running its ~5s suite. This
  # workflow is far too heavy for that, so it skips at the job level instead.)
  #
  # A job skipped by an `if:` condition reports SUCCESS to required status
  # checks, whereas a workflow skipped by a path filter reports nothing at all.
  # That difference is the entire fix. The `paths:` filter is deliberately KEPT
  # on `push` — main builds do not need to report contexts.
  #
  # DO NOT re-add `paths:` under `on.pull_request`.
  #
  # The gate below is `!cancelled() && ... != 'false'`, NOT `== 'true'`.
  # A plain `needs: changes` would skip every dependent job if the gate job
  # itself failed — and a skipped job reports SUCCESS, which would let a PR
  # merge with no tests run at all. This form inverts that: work is skipped
  # only on an explicit `false`, so any failure of the gate runs everything.
  changes:
    name: changes / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes relevant to myjobhunter
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Non-PR events (push to main) still carry the `paths:` filter below,
          # so if we are running at all the change is relevant by definition.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot semantics: only what THIS PR changed, ignoring commits
          # that landed on main after it branched.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || MERGE_BASE=""
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not compute merge base; running the full suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"; then
            echo "::warning::Could not diff; running the full suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::changed files"
          echo "$FILES"
          echo "::endgroup::"
          # Mirrors the `paths:` filter still applied to `push` below. Every
          # failure path above falls back to relevant=true — this gate may only
          # ever skip work it is certain is unrelated.
          if echo "$FILES" | grep -qE '^(apps/myjobhunter/|packages/|package\.json$|package-lock\.json$|\.github/workflows/ci-myjobhunter\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  backend-deps-resolve:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: backend-deps-resolve / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/myjobhunter/backend/requirements.txt

      - name: Resolve backend requirements
        working-directory: apps/myjobhunter/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  backend-tests:
    needs: changes
    # `!cancelled()` (not a `relevant` test) so the job still RUNS — and so still
    # expands its matrix into the five required contexts — even if the `changes`
    # gate job itself failed. The per-step conditions below then evaluate an empty
    # `relevant`, which is != 'false', so the full suite runs. Fail-safe either way.
    if: ${{ !cancelled() }}
    # NOTE: unlike every other job here, the gate is applied per-STEP, not at
    # the job level. A matrix job skipped by a job-level `if:` does not have its
    # matrix expanded, so GitHub reports ONE check literally named
    # "backend-tests / myjobhunter / ${{ matrix.shard.name }}" instead of the five
    # shard contexts. All five are REQUIRED status checks on main, so the PR would
    # stay blocked forever — the exact bug this gating was introduced to fix.
    #
    # Running the job and skipping its steps keeps the five real context names and
    # costs only a few seconds of runner startup per shard.
    name: backend-tests / myjobhunter / ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Every shard runs `pytest tests`; tests/conftest.py keeps only the
        # files tests/ci_shards.py assigns to MJH_TEST_SHARD. Files that no
        # list names run in `fast`, the catch-all, so a new test file is in
        # CI the moment it exists. (Until 2026-11 each shard listed its files
        # by path, and ~50 files were in no list — they never ran, and several
        # had rotted.) tests/test_ci_shards.py fails if these names drift
        # from tests/ci_shards.py. The names are required status checks on
        # main: rename or add one only together with branch protection.
        shard:
          - name: fast
          - name: crud
          - name: login-heavy
          - name: totp
          - name: refinement

    services:
      postgres:
        # pgvector/pgvector:pg16 — required by the discemb260511 migration
        # which runs ``CREATE EXTENSION vector``. Stock postgres:16 fails
        # at extension creation. Mirror of docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/test
      SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
      ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
      ANTHROPIC_API_KEY: sk-ant-placeholder-not-real
      TAVILY_API_KEY: tvly-placeholder-not-real
      GOOGLE_CLIENT_ID: placeholder-not-real-google-client
      GOOGLE_CLIENT_SECRET: placeholder-not-real-google-secret

    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.relevant != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: ${{ needs.changes.outputs.relevant != 'false' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/myjobhunter/backend/requirements.txt

      - name: Install backend dependencies
        if: ${{ needs.changes.outputs.relevant != 'false' }}
        working-directory: apps/myjobhunter/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        if: ${{ needs.changes.outputs.relevant != 'false' }}
        working-directory: apps/myjobhunter/backend
        run: PYTHONPATH=. alembic upgrade head

      - name: Run pytest (${{ matrix.shard.name }})
        if: ${{ needs.changes.outputs.relevant != 'false' }}
        working-directory: apps/myjobhunter/backend
        env:
          MJH_TEST_SHARD: ${{ matrix.shard.name }}
        # --timeout=60 (pytest-timeout) is a safety net so a future
        # teardown bug can't consume the whole shard timeout silently.
        run: python -m pytest -q --timeout=60 tests

  frontend-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: frontend-build / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=myjobhunter-frontend

      - name: Lint frontend
        run: npm run lint --workspace=myjobhunter-frontend

      - name: Typecheck E2E tests
        # The build only typechecks src/, and Playwright runs TS unchecked.
        run: npm run typecheck:e2e --workspace=myjobhunter-frontend

      - name: Test frontend
        run: npm test --workspace=myjobhunter-frontend

      - name: Check API client
        # Runs even when the website tests fail, so one red run shows both problems.
        if: ${{ !cancelled() }}
        run: |
          npm run typecheck --workspace=@myjobhunter/api-client
          npm run lint --workspace=@myjobhunter/api-client
          npm test --workspace=@myjobhunter/api-client

  caddy-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: caddy-image / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build caddy image (bakes frontend dist in)
        run: |
          docker build \
            -f apps/myjobhunter/docker/caddy.Dockerfile \
            -t myjobhunter-caddy:ci \
            .

      - name: Verify frontend dist is baked into image
        # Confirms the multi-stage build produced /srv/frontend/index.html
        # inside the caddy image. If this fails, the bake step silently
        # didn't copy the dist (wrong COPY path, wrong build stage, etc.).
        run: docker run --rm myjobhunter-caddy:ci test -f /srv/frontend/index.html

  frontend-layout-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: frontend-layout-e2e / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mocked specs in e2e/mocked/ answer every API call via page.route(); no
    # backend is started. They exercise real user flows (sign-in, list
    # loading, create, error states) against stubbed responses. The
    # full-stack specs elsewhere in e2e/ need a live backend and are not run
    # here (playwright.config.ts ignores e2e/mocked/).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/myjobhunter/frontend
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Run mocked E2E tests (no backend)
        working-directory: apps/myjobhunter/frontend
        # Runs everything in e2e/mocked/.
        run: npx playwright test --config=playwright.layout.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/myjobhunter/frontend/e2e/test-results-mocked/
          retention-days: 7
