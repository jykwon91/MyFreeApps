name: MyJobHunter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/myjobhunter/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-myjobhunter.yml'

permissions:
  contents: read

concurrency:
  group: ci-myjobhunter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filtering lives HERE, at the job level — NOT in `on.pull_request.paths`.
  #
  # Several of this workflow's checks are REQUIRED status checks on main. A
  # `pull_request` workflow skipped by a top-level `paths:` filter never reports
  # its check contexts at all, so every PR that did not touch myjobhunter hung forever
  # on "Expected — Waiting for status to be reported" and could only be landed
  # with `gh pr merge --admin`. (Same failure mode documented at length in
  # ci-shared-backend.yml, which solves it by always running its ~5s suite. This
  # workflow is far too heavy for that, so it skips at the job level instead.)
  #
  # A job skipped by an `if:` condition reports SUCCESS to required status
  # checks, whereas a workflow skipped by a path filter reports nothing at all.
  # That difference is the entire fix. The `paths:` filter is deliberately KEPT
  # on `push` — main builds do not need to report contexts.
  #
  # DO NOT re-add `paths:` under `on.pull_request`.
  #
  # The gate below is `!cancelled() && ... != 'false'`, NOT `== 'true'`.
  # A plain `needs: changes` would skip every dependent job if the gate job
  # itself failed — and a skipped job reports SUCCESS, which would let a PR
  # merge with no tests run at all. This form inverts that: work is skipped
  # only on an explicit `false`, so any failure of the gate runs everything.
  changes:
    name: changes / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes relevant to myjobhunter
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Non-PR events (push to main) still carry the `paths:` filter below,
          # so if we are running at all the change is relevant by definition.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot semantics: only what THIS PR changed, ignoring commits
          # that landed on main after it branched.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || MERGE_BASE=""
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not compute merge base; running the full suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"; then
            echo "::warning::Could not diff; running the full suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::changed files"
          echo "$FILES"
          echo "::endgroup::"
          # Mirrors the `paths:` filter still applied to `push` below. Every
          # failure path above falls back to relevant=true — this gate may only
          # ever skip work it is certain is unrelated.
          if echo "$FILES" | grep -qE '^(apps/myjobhunter/|packages/|package\.json$|package-lock\.json$|\.github/workflows/ci-myjobhunter\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  backend-deps-resolve:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: backend-deps-resolve / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/myjobhunter/backend/requirements.txt

      - name: Resolve backend requirements
        working-directory: apps/myjobhunter/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  backend-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: backend-tests / myjobhunter / ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard:
          # The auth suite is dominated by Argon2 password hashing — the slow
          # tests are the ones that issue many login attempts (account
          # lockout, per-IP rate limit, account deletion re-auth, data
          # export login). Splitting by file across four shards keeps any
          # single shard inside the 10-min timeout and lets them run in
          # parallel.
          - name: fast
            paths: >-
              tests/test_health.py
              tests/test_auth.py
              tests/test_hibp_validation.py
              tests/test_turnstile.py
              tests/test_tenant_isolation.py
              tests/test_audit.py
              tests/test_email_verification.py
              tests/test_config_key_validation.py
          - name: crud
            # Phase 2 CRUD tests. Covers applications full CRUD, contacts,
            # events, list filters, company writes + name search, and profiles.
            #
            # NOTE: test_application_writes.py is INTENTIONALLY EXCLUDED.
            # 4 of its TestCreateApplication tests consistently exceed the
            # 60s pytest-timeout regardless of shard placement — pre-existing
            # slowness from Argon2 password hashing in the user_factory
            # fixture × multiple tests per class. Logged in
            # apps/myjobhunter/TECH_DEBT.md; add back once the fixture is
            # refactored to share a hashed password across tests or the slow
            # tests are split into a dedicated long-timeout shard.
            paths: >-
              tests/test_application_get_by_id.py
              tests/test_application_status_column.py
              tests/test_application_events.py
              tests/test_application_contacts.py
              tests/test_application_list_filters.py
              tests/test_application_company_filter.py
              tests/test_company_writes.py
              tests/test_company_name_search.py
              tests/test_profile_writes.py
          - name: login-heavy
            paths: >-
              tests/test_account_lockout.py
              tests/test_login_ip_rate_limit.py
              tests/test_account_deletion.py
              tests/test_data_export.py
          - name: totp
            paths: >-
              tests/test_totp_login.py
              tests/test_totp_setup.py
          - name: refinement
            # Resume refinement + parse suites: pure-function + mocked tests (no
            # DB fixtures, no Argon2 login storm) — runs in seconds.
            # These files were previously in NO shard, so none of them
            # gated merges; a hallucination-guard regression shipped
            # because of it. The broader explicit-path-allowlist gap is
            # logged in apps/myjobhunter/TECH_DEBT.md.
            paths: >-
              tests/test_resume_refinement_hallucination_guard.py
              tests/test_resume_refinement_rewrite_service.py
              tests/test_resume_refinement_critique_service.py
              tests/test_resume_refinement_markdown_renderer.py
              tests/test_resume_refinement_renderer.py
              tests/test_resume_refinement_proposal_cache.py
              tests/test_resume_refinement_session_helpers.py
              tests/test_resume_refinement_guard_confirmation.py
              tests/test_resume_refinement_preparing_flow.py
              tests/test_resume_parse_provenance.py
              tests/test_resume_mapper.py
              tests/test_resume_refinement_user_targets.py

    services:
      postgres:
        # pgvector/pgvector:pg16 — required by the discemb260511 migration
        # which runs ``CREATE EXTENSION vector``. Stock postgres:16 fails
        # at extension creation. Mirror of docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/test
      SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
      ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
      ANTHROPIC_API_KEY: sk-ant-placeholder-not-real
      TAVILY_API_KEY: tvly-placeholder-not-real
      GOOGLE_CLIENT_ID: placeholder-not-real-google-client
      GOOGLE_CLIENT_SECRET: placeholder-not-real-google-secret

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/myjobhunter/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/myjobhunter/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        working-directory: apps/myjobhunter/backend
        run: PYTHONPATH=. alembic upgrade head

      - name: Run pytest (${{ matrix.shard.name }})
        working-directory: apps/myjobhunter/backend
        # --timeout=60 (pytest-timeout) is a safety net so a future
        # teardown bug can't consume the whole shard timeout silently.
        run: python -m pytest -q --timeout=60 ${{ matrix.shard.paths }}

  frontend-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: frontend-build / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=myjobhunter-frontend

  caddy-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    name: caddy-image / myjobhunter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build caddy image (bakes frontend dist in)
        run: |
          docker build \
            -f apps/myjobhunter/docker/caddy.Dockerfile \
            -t myjobhunter-caddy:ci \
            .

      - name: Verify frontend dist is baked into image
        # Confirms the multi-stage build produced /srv/frontend/index.html
        # inside the caddy image. If this fails, the bake step silently
        # didn't copy the dist (wrong COPY path, wrong build stage, etc.).
        run: docker run --rm myjobhunter-caddy:ci test -f /srv/frontend/index.html
