name: MyRecipes CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/myrecipes/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-myrecipes.yml'

permissions:
  contents: read

concurrency:
  group: ci-myrecipes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filtering lives HERE, at the job level — NOT in `on.pull_request.paths`.
  # See ci-mybookkeeper.yml for the full rationale (required status checks,
  # skipped-by-if reports success, fail-open gate form).
  #
  # DO NOT re-add `paths:` under `on.pull_request`.
  #
  # Three outputs — `backend`, `frontend`, `relevant` (= backend || frontend):
  # backend-only jobs gate on `backend`; frontend-only jobs gate on `frontend`.
  changes:
    name: changes / myrecipes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes relevant to myrecipes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Non-PR events (push to main): paths: filter still applied above, so
          # if this job is running at all the change is relevant — set all true.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || MERGE_BASE=""
          if [ -z "$MERGE_BASE" ]; then
            echo "::warning::Could not compute merge base; running the full suite."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"; then
            echo "::warning::Could not diff; running the full suite."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::changed files"
          echo "$FILES"
          echo "::endgroup::"

          BACKEND=false
          FRONTEND=false

          # Workflow file itself → run everything.
          if echo "$FILES" | grep -qE '^\.github/workflows/ci-myrecipes\.yml$'; then
            BACKEND=true; FRONTEND=true
          fi
          # packages/shared-backend/ → backend only.
          if echo "$FILES" | grep -qE '^packages/shared-backend/'; then
            BACKEND=true
          fi
          # packages/shared-frontend/ → frontend only.
          if echo "$FILES" | grep -qE '^packages/shared-frontend/'; then
            FRONTEND=true
          fi
          # packages/ outside the two shared packages → both (ambiguous).
          PKG_OTHER="$(echo "$FILES" | grep -E '^packages/' | grep -vE '^packages/shared-(backend|frontend)/' || true)\"
          if [ -n "$PKG_OTHER" ]; then
            BACKEND=true; FRONTEND=true
          fi
          # apps/myrecipes/backend/ → backend only.
          if echo "$FILES" | grep -qE '^apps/myrecipes/backend/'; then
            BACKEND=true
          fi
          # apps/myrecipes/frontend/ → frontend only.
          if echo "$FILES" | grep -qE '^apps/myrecipes/frontend/'; then
            FRONTEND=true
          fi
          # apps/myrecipes/ outside backend/ or frontend/ (docker/, Caddyfile,
          # docker-compose.yml, etc.) → both (ambiguous infra change).
          APP_OTHER="$(echo "$FILES" | grep -E '^apps/myrecipes/' | grep -vE '^apps/myrecipes/(backend|frontend)/' || true)\"
          if [ -n "$APP_OTHER" ]; then
            BACKEND=true; FRONTEND=true
          fi
          # package.json / package-lock.json → frontend.
          if echo "$FILES" | grep -qE '^(package\.json|package-lock\.json)$'; then
            FRONTEND=true
          fi

          # relevant = backend || frontend (used by jobs spanning both layers).
          if [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ]; then
            RELEVANT=true
          else
            RELEVANT=false
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"

  backend-deps-resolve:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: backend-deps-resolve / myrecipes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/myrecipes/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify lockfile is consistent with pyproject.toml
        working-directory: apps/myrecipes/backend
        run: uv lock --check

      - name: Sync backend dependencies from lockfile
        working-directory: apps/myrecipes/backend
        run: uv sync --frozen

  backend-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    name: backend-tests / myrecipes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Stock postgres:16 — MyRecipes does NOT use pgvector.
        # Mirrors apps/myrecipes/docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/test
      SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
      ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
      # Environment kept at default ("development") so production boot
      # guards (Sentry, email backend, Turnstile) stay off in CI.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/myrecipes/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync backend dependencies (incl. dev group)
        # The `dev` dependency-group in pyproject.toml carries pytest +
        # pytest-asyncio + pytest-timeout. ``uv sync --frozen --group dev``
        # installs both runtime deps and dev tools from the lockfile.
        working-directory: apps/myrecipes/backend
        run: uv sync --frozen --group dev

      - name: Run alembic migrations
        working-directory: apps/myrecipes/backend
        run: PYTHONPATH=. uv run alembic upgrade head

      - name: Run pytest
        working-directory: apps/myrecipes/backend
        # PYTHONPATH=. so pytest can import `app` — uv's venv-aware `uv run`
        # doesn't add CWD to sys.path the way `python -m pytest` would, and
        # this project is `package = false` (no installed entry point).
        # --timeout=60 (pytest-timeout) is a safety net so a future teardown
        # bug can't consume the whole job timeout silently.
        run: PYTHONPATH=. uv run pytest -q --timeout=60

  frontend-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    name: frontend-build / myrecipes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        # Use `npm install` rather than `npm ci`: there is a known npm bug
        # (https://github.com/npm/cli/issues/4828) where workspace + optional
        # platform-specific deps (rollup, esbuild) interact badly with `npm ci`'s
        # strict lockfile validation, producing
        # `Cannot find module '@rollup/rollup-linux-x64-gnu'` failures even when
        # the lockfile has the entry. `npm install` is more lenient + self-heals.
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=myrecipes-frontend

  caddy-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    name: caddy-image / myrecipes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build caddy image (bakes frontend dist in)
        run: |
          docker build \
            -f apps/myrecipes/docker/caddy.Dockerfile \
            -t myrecipes-caddy:ci \
            .

      - name: Verify frontend dist is baked into image
        # Confirms the multi-stage build produced /srv/frontend/index.html
        # inside the caddy image. If this fails, the bake step silently didn't
        # copy the dist (wrong COPY path, wrong build stage, etc.).
        run: docker run --rm myrecipes-caddy:ci test -f /srv/frontend/index.html
