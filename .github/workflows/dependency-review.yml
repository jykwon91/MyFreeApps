name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # GHSA-wj6h-64fc-37mp: Minerva timing attack on P-256 in python-ecdsa.
          # Pulled in transitively by python-jose (used for JWT decode in mybookkeeper).
          # Timing-side-channel attack — requires precise local timing measurements;
          # not exploitable over typical noisy network conditions. Tracked for proper
          # mitigation via python-jose → PyJWT migration in MyBookkeeper.
          # GHSA-3g3m-2fjr-6pw4 (glob) and GHSA-g3hv-75wg-m249 (minimatch): reached through
          # @expo/cli, which is developer and CI tooling only. Their fixes are major versions
          # Expo hasn't adopted. Tracked in #1489.
          allow-ghsas: GHSA-wj6h-64fc-37mp, GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249
