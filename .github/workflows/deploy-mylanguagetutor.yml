# GENERATED FROM infra/templates/.github/workflows/deploy.yml.j2 — DO NOT EDIT.
# Edit the template + apps/<app>/app.yaml; re-render via:
#   python -m platform_shared.infra.render --app mylanguagetutor

name: Deploy MyLanguageTutor

on:
  # Manual "Run workflow" button — always available so any app can be
  # deployed on demand, even when auto-deploy is off. Deploys the commit the
  # run was started on.
  workflow_dispatch:
  # Auto-deploy. Rendered ONLY when `automated_deploy` is truthy in
  # apps/<slug>/app.yaml. A missing key defaults to enabled. Set
  # `automated_deploy: false` to make an app manual-dispatch-only.
  #
  # Production deploys only a commit that passed this app's CI ON MAIN. PRs
  # merge without being rebased on the latest main, so two PRs can each pass
  # CI alone and break once combined — the main run is the first to test the
  # combination. Triggering on `push` would ship that combination before its
  # CI finished.
  #
  # The CI workflow's push `paths:` (apps/<slug>/** and packages/**, minus
  # mobile, plus the root npm manifest + lockfile) decide which commits get
  # here; mobile-only changes do not run it, so they do not redeploy.
  workflow_run:
    workflows: ["MyLanguageTutor CI"]
    types: [completed]
    branches: [main]

env:
  # The commit to build and ship. Under workflow_run, github.sha is main's
  # CURRENT head — possibly a newer, untested commit — so use the commit the
  # CI run actually tested. Manual dispatch has no CI run: use github.sha.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: deploy-mylanguagetutor
  cancel-in-progress: false

jobs:
  # ONE job: build + push images, then SSH-deploy, on the same runner.
  # Previously build-and-push and deploy were separate jobs, so every deploy
  # queued for a runner TWICE (1.5-4 min of pure wait under contention, more
  # than the deploy's actual work). Keeping it one job pays the queue once.
  deploy:
    runs-on: ubuntu-latest
    # Only a CI run for a push to main that SUCCEEDED. A failed or cancelled
    # run (cancelled = superseded by a newer pending run in the CI
    # concurrency group) deploys nothing; the newer run deploys when it passes.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
      # `gh run list` in the newer-commit check below.
      actions: read

    steps:
      # Never ship an older commit over a newer one. Re-running an older
      # commit's CI (e.g. retrying a flaky run) fires this workflow again. If
      # a newer commit has since passed CI, it has been or will be deployed and
      # already contains this one; deploying this one would roll production
      # back to code older than the schema it has migrated to.
      - name: Skip if a newer commit has passed CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-mylanguagetutor.yml \
            --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$LATEST" --jq .status)
          if [ "$STATUS" = "ahead" ]; then
            echo "::notice::$LATEST passed CI after $DEPLOY_SHA and contains it, so this older commit is not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Build images on the GitHub runner (fast, layer-cached via type=gha) and
      # push to GHCR. The VPS step below PULLS these prebuilt images instead of
      # building on the VPS — cutting deploy time from ~20m to ~2-3m and
      # shrinking the container-recreate downtime window. Each image is tagged
      # with the commit SHA (immutable; enables rollback via
      # `IMAGE_TAG=<old-sha> docker compose up -d`) plus :latest. GHCR
      # namespace = the repo owner (jykwon91).
      - name: Set up Docker Buildx
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mylanguagetutor/docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/jykwon91/myfreeapps-mylanguagetutor-backend:${{ env.DEPLOY_SHA }}
            ghcr.io/jykwon91/myfreeapps-mylanguagetutor-backend:latest
          build-args: |
            GIT_COMMIT=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mylanguagetutor-backend
          cache-to: type=gha,mode=max,scope=mylanguagetutor-backend

      - name: Build and push caddy image
        if: steps.gate.outputs.deploy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mylanguagetutor/docker/caddy.Dockerfile
          push: true
          tags: |
            ghcr.io/jykwon91/myfreeapps-mylanguagetutor-caddy:${{ env.DEPLOY_SHA }}
            ghcr.io/jykwon91/myfreeapps-mylanguagetutor-caddy:latest
          # VITE_* values are inlined into the frozen bundle at build time. They
          # now come from GitHub Actions variables (public values — the Turnstile
          # site key is rendered into the HTML) instead of the VPS .env.docker,
          # because the build no longer runs on the VPS. See
          # rules/verify-frontend-build-args.md.
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.MYLANGUAGETUTOR_VITE_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=mylanguagetutor-caddy
          cache-to: type=gha,mode=max,scope=mylanguagetutor-caddy

      - name: Deploy to VPS
        if: steps.gate.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Forwarded into the remote script via `envs:` below. IMAGE_TAG pins the
          # exact images the build steps above just pushed; GHCR_* authenticate
          # the VPS to pull the (private) packages.
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          # Generous: deploys are serialized via the flock below, so a
          # later app can wait through several earlier app deploys before
          # its own runs. 10m was too tight once deploys serialize.
          command_timeout: 30m
          script: |
            set -e

            # Serialize deploys across ALL apps on this shared VPS.
            # Every app's deploy SSHes here and `git pull`s the SAME
            # /srv/myfreeapps checkout; a `packages/**` change fans out
            # to every app's deploy workflow at once. Without this lock
            # they race on the shared git refs — observed failures:
            #   error: cannot lock ref 'refs/remotes/origin/main'
            #   fatal: Cannot fast-forward to multiple branches
            # flock gives mutual exclusion WITHOUT dropping any app's
            # deploy. A shared GitHub `concurrency` group can't be used
            # here: it cancels intermediate *pending* runs, silently
            # skipping some apps. So `concurrency.group` stays per-app
            # (GitHub runs all of them) and this lock orders them. The
            # lock auto-releases when this SSH script exits, even on
            # failure (FD closed on process exit).
            exec 9>/tmp/myfreeapps-deploy.lock
            if ! flock -w 1500 9; then
              echo "::error::Timed out (25m) waiting for the VPS deploy lock — an earlier app deploy is wedged. Investigate before retrying."
              exit 1
            fi

            cd /srv/myfreeapps

            echo "--- Pull latest code ---"
            git pull --ff-only

            echo "--- Preflight: verify required env files exist ---"
            test -f /srv/myfreeapps/apps/mylanguagetutor/.env || {
              echo "::error::Missing /srv/myfreeapps/apps/mylanguagetutor/.env — seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend python3 -m platform_shared.infra.seed_env --app mylanguagetutor'"
              exit 1
            }
            test -f /srv/myfreeapps/apps/mylanguagetutor/backend/.env.docker || {
              echo "::error::Missing /srv/myfreeapps/apps/mylanguagetutor/backend/.env.docker — seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend python3 -m platform_shared.infra.seed_env --app mylanguagetutor'"
              exit 1
            }
            echo "Env files present — proceeding"

            echo "--- Authenticate to GHCR and pull prebuilt images ---"
            # Images were built + pushed by the build steps on the runner.
            # The VPS only pulls — no on-box build. IMAGE_TAG pins this commit's
            # images; docker-compose resolves ${IMAGE_TAG:-latest} against it for
            # `pull`, `up`, and any later `create`.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f apps/mylanguagetutor/docker-compose.yml pull
            docker compose -f apps/mylanguagetutor/docker-compose.yml up -d --remove-orphans

            echo "--- One-time cleanup: remove obsolete frontend_dist volume ---"
            # The frontend_dist volume was used by the pre-baked-caddy layout.
            # The new layout bakes dist into the caddy image; volume is orphaned.
            docker volume rm mylanguagetutor_frontend_dist 2>/dev/null || true

            echo "--- Run database migrations ---"
            docker compose -f apps/mylanguagetutor/docker-compose.yml exec -T api alembic upgrade head

            echo "--- Wait for API health check ---"
            for i in $(seq 1 30); do
              if docker compose -f apps/mylanguagetutor/docker-compose.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')" 2>/dev/null; then
                echo "API is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API health check failed after 30 attempts"
                docker compose -f apps/mylanguagetutor/docker-compose.yml logs api --tail=50
                exit 1
              fi
              sleep 2
            done

            echo "--- Update host Caddyfile ---"
            # Sync the SHARED host Caddyfile (infra/Caddyfile) → /etc/caddy/Caddyfile.
            # Shared with deploy-landing.yml — see infra/sync-host-caddyfile.sh.
            sudo bash infra/sync-host-caddyfile.sh

            echo "--- Reclaim disk: prune images + build cache superseded by this deploy ---"
            # Registry-pull deploys (registry_images) fetch a fresh SHA-tagged
            # image from GHCR every time but never remove the prior one, so
            # orphaned image layers accumulate across ALL apps on this shared
            # 24GB droplet until the disk fills and the next deploy's "Deploy to
            # VPS" step fails (observed 2026-06-23 at 99% full). The new
            # containers are already up and the health check above has passed,
            # so the in-use image is safe — `image prune -af` only removes
            # dangling + unreferenced images (never the running one). Run on
            # every app's deploy; the first one to fire after a fan-out reclaims
            # the shared layers, the rest are cheap no-ops.
            docker image prune -af || true
            docker builder prune -af || true

            echo "--- Clean up GHCR credentials ---"
            docker logout ghcr.io || true
