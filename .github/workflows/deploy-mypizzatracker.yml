# GENERATED FROM infra/templates/.github/workflows/deploy.yml.j2 — DO NOT EDIT.
# Edit the template + apps/<app>/app.yaml; re-render via:
#   python -m platform_shared.infra.render --app mypizzatracker

name: Deploy MyPizzaTracker

on:
  # Manual "Run workflow" button — always available so any app can be
  # deployed on demand, even when auto-deploy is off. Deploys the commit the
  # run was started on (github.sha) as-is: it is the operator's override, so
  # it is not retargeted.
  workflow_dispatch:
  # Auto-deploy. Rendered ONLY when `automated_deploy` is truthy in
  # apps/<slug>/app.yaml. A missing key defaults to enabled. Set
  # `automated_deploy: false` to make an app manual-dispatch-only.
  #
  # Production deploys only a commit that passed this app's CI ON MAIN. PRs
  # merge without being rebased on the latest main, so two PRs can each pass
  # CI alone and break once combined — the main run is the first to test the
  # combination. Triggering on `push` would ship that combination before its
  # CI finished.
  #
  # The CI workflow's push `paths:` decide which commits get here:
  # apps/<slug>/** and packages/**, minus the app's mobile/ and
  # packages/shared-mobile/, so a mobile-only change does not redeploy. The
  # root package.json + package-lock.json stay in: the web images `npm ci`
  # from them, so a web dependency fix must deploy. The cost is that a
  # mobile-only dependency bump, which also edits the root lockfile, redeploys.
  #
  # A commit pushed with `[skip ci]` skips CI, so it no longer deploys either.
  # The next commit that passes CI ships it.

jobs:
  # ONE job: build + push images, then SSH-deploy, on the same runner.
  # Previously build-and-push and deploy were separate jobs, so every deploy
  # queued for a runner TWICE (1.5-4 min of pure wait under contention, more
  # than the deploy's actual work). Keeping it one job pays the queue once.
  deploy:
    runs-on: ubuntu-latest
    # Job-level, NOT workflow-level: a run whose `if:` skips the job (a failed
    # or PR CI run) must never take the slot and cancel a pending real deploy.
    concurrency:
      group: deploy-mypizzatracker
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      # Pick the ONE commit this run deploys; every later step uses
      # steps.gate.outputs.sha. Under workflow_run, github.sha is main's
      # current head — possibly untested — so start from the commit the CI
      # run tested, then move to the newest commit that has since passed the
      # same CI on main and contains it. Re-running an older commit's CI
      # therefore deploys the newest passed commit instead of rolling
      # production back past migrations already applied, whatever order the
      # runs are listed in. Any listing or API failure fails the deploy.
      - name: Choose the commit to deploy
        id: gate
        run: |
          set -euo pipefail
          TARGET="$GITHUB_SHA"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.sha }}

      # Build images on the GitHub runner (fast, layer-cached via type=gha) and
      # push to GHCR. The VPS step below PULLS these prebuilt images instead of
      # building on the VPS — cutting deploy time from ~20m to ~2-3m and
      # shrinking the container-recreate downtime window. Each image is tagged
      # with the commit SHA (immutable; enables rollback via
      # `IMAGE_TAG=<old-sha> docker compose up -d`) plus :latest. GHCR
      # namespace = the repo owner (jykwon91).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mypizzatracker/docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/jykwon91/myfreeapps-mypizzatracker-backend:${{ steps.gate.outputs.sha }}
            ghcr.io/jykwon91/myfreeapps-mypizzatracker-backend:latest
          build-args: |
            GIT_COMMIT=${{ steps.gate.outputs.sha }}
          cache-from: type=gha,scope=mypizzatracker-backend
          cache-to: type=gha,mode=max,scope=mypizzatracker-backend

      - name: Build and push caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mypizzatracker/docker/caddy.Dockerfile
          push: true
          tags: |
            ghcr.io/jykwon91/myfreeapps-mypizzatracker-caddy:${{ steps.gate.outputs.sha }}
            ghcr.io/jykwon91/myfreeapps-mypizzatracker-caddy:latest
          # VITE_* values are inlined into the frozen bundle at build time. They
          # now come from GitHub Actions variables (public values — the Turnstile
          # site key is rendered into the HTML) instead of the VPS .env.docker,
          # because the build no longer runs on the VPS. See
          # rules/verify-frontend-build-args.md.
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.MYPIZZATRACKER_VITE_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=mypizzatracker-caddy
          cache-to: type=gha,mode=max,scope=mypizzatracker-caddy

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Forwarded into the remote script via `envs:` below. DEPLOY_SHA is
          # the commit the checkout on the box fast-forwards to.
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
          # IMAGE_TAG pins the exact images the build steps above just pushed;
          # GHCR_* authenticate the VPS to pull the (private) packages.
          IMAGE_TAG: ${{ steps.gate.outputs.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          # Generous: deploys are serialized via the flock below, so a
          # later app can wait through several earlier app deploys before
          # its own runs. 10m was too tight once deploys serialize.
          command_timeout: 30m
          script: |
            set -e

            # Serialize deploys across ALL apps on this shared VPS.
            # Every app's deploy SSHes here and fast-forwards the SAME
            # /srv/myfreeapps checkout; a `packages/**` change fans out
            # to every app's deploy workflow at once. Without this lock
            # they race on the shared git refs — observed failures:
            #   error: cannot lock ref 'refs/remotes/origin/main'
            #   fatal: Cannot fast-forward to multiple branches
            # flock gives mutual exclusion WITHOUT dropping any app's
            # deploy. A shared GitHub `concurrency` group can't be used
            # here: it cancels intermediate *pending* runs, silently
            # skipping some apps. So `concurrency.group` stays per-app
            # (GitHub runs all of them) and this lock orders them. The
            # lock auto-releases when this SSH script exits, even on
            # failure (FD closed on process exit).
            exec 9>/tmp/myfreeapps-deploy.lock
            if ! flock -w 1500 9; then
              echo "::error::Timed out (25m) waiting for the VPS deploy lock — an earlier app deploy is wedged. Investigate before retrying."
              exit 1
            fi

            cd /srv/myfreeapps

            echo "--- Fast-forward the checkout to the deploy commit ---"
            # Never `git pull`: main's head may not have passed CI yet. The
            # compose file and host Caddyfile used below come from this
            # checkout. A no-op when it is already past DEPLOY_SHA (another
            # deploy shipped a newer passed commit), so it never moves back.
            git fetch origin main
            git merge --ff-only "$DEPLOY_SHA"

            echo "--- Preflight: verify required env files exist ---"
            test -f /srv/myfreeapps/apps/mypizzatracker/.env || {
              echo "::error::Missing /srv/myfreeapps/apps/mypizzatracker/.env — seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend python3 -m platform_shared.infra.seed_env --app mypizzatracker'"
              exit 1
            }
            test -f /srv/myfreeapps/apps/mypizzatracker/backend/.env.docker || {
              echo "::error::Missing /srv/myfreeapps/apps/mypizzatracker/backend/.env.docker — seed with 'cd /srv/myfreeapps && PYTHONPATH=packages/shared-backend python3 -m platform_shared.infra.seed_env --app mypizzatracker'"
              exit 1
            }
            echo "Env files present — proceeding"

            echo "--- Authenticate to GHCR and pull prebuilt images ---"
            # Images were built + pushed by the build steps on the runner.
            # The VPS only pulls — no on-box build. IMAGE_TAG pins this commit's
            # images; docker-compose resolves ${IMAGE_TAG:-latest} against it for
            # `pull`, `up`, and any later `create`.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f apps/mypizzatracker/docker-compose.yml pull
            docker compose -f apps/mypizzatracker/docker-compose.yml up -d --remove-orphans

            echo "--- One-time cleanup: remove obsolete frontend_dist volume ---"
            # The frontend_dist volume was used by the pre-baked-caddy layout.
            # The new layout bakes dist into the caddy image; volume is orphaned.
            docker volume rm mypizzatracker_frontend_dist 2>/dev/null || true

            echo "--- Run database migrations ---"
            docker compose -f apps/mypizzatracker/docker-compose.yml exec -T api alembic upgrade head

            echo "--- Wait for API health check ---"
            for i in $(seq 1 30); do
              if docker compose -f apps/mypizzatracker/docker-compose.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')" 2>/dev/null; then
                echo "API is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API health check failed after 30 attempts"
                docker compose -f apps/mypizzatracker/docker-compose.yml logs api --tail=50
                exit 1
              fi
              sleep 2
            done

            echo "--- Update host Caddyfile ---"
            # Sync the SHARED host Caddyfile (infra/Caddyfile) → /etc/caddy/Caddyfile.
            # Shared with deploy-landing.yml — see infra/sync-host-caddyfile.sh.
            sudo bash infra/sync-host-caddyfile.sh

            echo "--- Reclaim disk: prune images + build cache superseded by this deploy ---"
            # Registry-pull deploys (registry_images) fetch a fresh SHA-tagged
            # image from GHCR every time but never remove the prior one, so
            # orphaned image layers accumulate across ALL apps on this shared
            # 24GB droplet until the disk fills and the next deploy's "Deploy to
            # VPS" step fails (observed 2026-06-23 at 99% full). The new
            # containers are already up and the health check above has passed,
            # so the in-use image is safe — `image prune -af` only removes
            # dangling + unreferenced images (never the running one). Run on
            # every app's deploy; the first one to fire after a fan-out reclaims
            # the shared layers, the rest are cheap no-ops.
            docker image prune -af || true
            docker builder prune -af || true

            echo "--- Clean up GHCR credentials ---"
            docker logout ghcr.io || true
