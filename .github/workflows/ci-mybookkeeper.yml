name: MyBookkeeper CI

on:
  # Pull requests run this through ci.yml, which decides once (.github/scripts/ci_changes.py)
  # whether this app is affected at all and only then calls this workflow.
  workflow_call:
  # A successful push run is what deploys this app (deploy-mybookkeeper.yml runs on
  # workflow_run of this workflow), so mobile-only changes are excluded here:
  # they cannot change the web bundle or API image. Mobile has its own CI.
  push:
    branches: [main]
    paths:
      - 'apps/mybookkeeper/**'
      - '!apps/mybookkeeper/mobile/**'
      - 'packages/**'
      - '!packages/shared-mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-mybookkeeper.yml'

permissions:
  contents: read

concurrency:
  group: ci-mybookkeeper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-deps-resolve:
    name: backend-deps-resolve / mybookkeeper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/mybookkeeper/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify lockfile is consistent with pyproject.toml
        working-directory: apps/mybookkeeper/backend
        run: uv lock --check

      - name: Sync backend dependencies from lockfile
        working-directory: apps/mybookkeeper/backend
        run: uv sync --frozen

  backend-tests:
    name: backend-tests / mybookkeeper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The suite runs on in-memory SQLite. Tests of what only Postgres has (the
    # audit_logs immutability trigger) run against this database, migrated to
    # head, through MBK_TEST_POSTGRES_URL; they are skipped without it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbk
          POSTGRES_PASSWORD: ci_only_pw # gitleaks:allow
          POSTGRES_DB: mbk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/mybookkeeper/backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync backend dependencies
        working-directory: apps/mybookkeeper/backend
        # Installs the `dev` dependency-group too (pytest, pytest-asyncio,
        # aiosqlite, pytest-xdist), so CI and a local `uv sync` resolve the
        # same test toolchain from the lockfile instead of drifting.
        run: uv sync --frozen

      - name: Install shared-backend package
        # platform_shared lives at packages/shared-backend and is imported by
        # apps/mybookkeeper/backend (auth events, HIBP, Turnstile, etc.).
        # Install into the same uv venv so MBK's tests can resolve it.
        working-directory: apps/mybookkeeper/backend
        run: uv pip install ../../../packages/shared-backend

      - name: Migrate test Postgres
        working-directory: apps/mybookkeeper/backend
        env:
          DATABASE_URL: postgresql+asyncpg://mbk:ci_only_pw@127.0.0.1:5432/mbk_test # gitleaks:allow
          DATABASE_URL_SYNC: postgresql://mbk:ci_only_pw@127.0.0.1:5432/mbk_test # gitleaks:allow
          SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
          ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
          ANTHROPIC_API_KEY: sk-ant-placeholder-not-real
          GOOGLE_CLIENT_ID: placeholder-not-real-google-client
          GOOGLE_CLIENT_SECRET: placeholder-not-real-google-secret
          PYTHONPATH: .
        run: uv run alembic upgrade head

      - name: Run pytest
        working-directory: apps/mybookkeeper/backend
        env:
          MBK_TEST_POSTGRES_URL: postgresql+asyncpg://mbk:ci_only_pw@127.0.0.1:5432/mbk_test # gitleaks:allow
          # Dummy values — tests use in-memory sqlite, not these envs, but pydantic-settings may require them.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
          SECRET_KEY: "ci-placeholder-secret-key-not-real-32chars" # gitleaks:allow
          ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-real-32" # gitleaks:allow
          ANTHROPIC_API_KEY: sk-ant-placeholder-not-real
          GOOGLE_CLIENT_ID: placeholder-not-real-google-client
          GOOGLE_CLIENT_SECRET: placeholder-not-real-google-secret
        # -n auto spreads the ~3.6k tests across the runner's cores. Each
        # xdist worker is its own process, so the session-scoped in-memory
        # database in tests/conftest.py is per-worker and stays isolated.
        run: uv run pytest -q -m "not integration" -n auto

  frontend-checks:
    name: frontend-checks / mybookkeeper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Root package.json is an npm workspace covering all apps' frontends.
        # Use `npm install` rather than `npm ci`: there is a known npm bug
        # (https://github.com/npm/cli/issues/4828) where workspace + optional
        # platform-specific deps (rollup, esbuild) interact badly with the
        # strict lockfile validation in `npm ci`, producing
        # `Cannot find module '@rollup/rollup-linux-x64-gnu'` failures even
        # when the lockfile has the entry. `npm install` is more lenient
        # and self-heals.
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=mybookkeeper-frontend

      - name: Lint frontend
        run: npm run lint --workspace=mybookkeeper-frontend

      - name: Typecheck E2E tests
        # The build only typechecks src/, so type errors in e2e/ went unseen.
        run: npm run typecheck:e2e --workspace=mybookkeeper-frontend

      - name: Check API client
        # Runs even when the website lint fails, so one red run shows both problems.
        if: ${{ !cancelled() }}
        run: |
          npm run typecheck --workspace=@mybookkeeper/api-client
          npm run lint --workspace=@mybookkeeper/api-client
          npm test --workspace=@mybookkeeper/api-client

  frontend-tests:
    name: frontend-tests / mybookkeeper (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # `npm install`, not `npm ci`: see the frontend-checks job.
        run: npm install

      - name: Test frontend
        # The website's unit tests, split in two so each half stays well inside the timeout.
        run: npm test --workspace=mybookkeeper-frontend -- --shard=${{ matrix.shard }}/2

  frontend-build:
    # The required check: passes only when the checks and both test halves pass (or were skipped as irrelevant).
    needs: [frontend-checks, frontend-tests]
    if: ${{ always() }}
    name: frontend-build / mybookkeeper
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require frontend checks and tests
        env:
          CHECKS: ${{ needs.frontend-checks.result }}
          TESTS: ${{ needs.frontend-tests.result }}
        run: |
          echo "frontend-checks: $CHECKS, frontend-tests: $TESTS"
          for r in "$CHECKS" "$TESTS"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # The `frontend-lockfile-drift` job was removed 2026-05-11 (PR 6 of React 19
  # migration). MBK's caddy.Dockerfile now uses the workspace pattern (mirrors
  # apps/myjobhunter/docker/caddy.Dockerfile) and consumes the root
  # package-lock.json via `npm ci` at the monorepo root inside the build
  # container. The per-app `apps/mybookkeeper/frontend/package-lock.json` is
  # deleted because it cannot represent workspace deps like `@platform/ui`,
  # and the docker build no longer reads it. The `frontend-checks` job above
  # already validates the workspace lockfile resolves cleanly.

  frontend-layout-e2e:
    name: frontend-layout-e2e / mybookkeeper (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Layout tests fully mock their API surface via page.route() and read
    # files directly off disk (e.g. Caddyfile contract test). No backend
    # required. Catches the class of bug that 2026-05-01 surfaced manually:
    # local Button missing justify-center, Caddyfile XFO/CSP scoping wrong,
    # iframe rendering regressions.
    # Split in two: one runner took 8-9.5 minutes and was hitting the 10-minute limit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # See frontend-checks job above for why npm install vs npm ci.
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/mybookkeeper/frontend
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Run mocked E2E tests (no backend)
        working-directory: apps/mybookkeeper/frontend
        # Runs everything in e2e/mocked/.
        run: npx playwright test --config=playwright.layout.config.ts --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/mybookkeeper/frontend/e2e/test-results-mocked/
          retention-days: 7
