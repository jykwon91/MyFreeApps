name: "MyFreeApps CodeQL config"

# Use security-focused queries only — drop the 'security-and-quality' suite,
# which produces hundreds of style/maintainability notes that bury real signal.
queries:
  - uses: security-extended

paths-ignore:
  # Test files — frequently use loose regex patterns and intentional dummy values
  # that trigger false positives on real-world security rules.
  - "**/__tests__/**"
  - "**/e2e/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test_*.py"
  - "**/tests/**"
  # Snapshot/build artifacts
  - "**/dist/**"
  - "**/build/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  # Two MyBookkeeper files with intentional design choices that CodeQL flags as
  # high-severity but are by-design. Documented per file:
  #
  # apps/mybookkeeper/backend/app/repositories/db_admin_repo.py — admin-only ad-hoc
  # SELECT runner. User-provided SQL is the design contract. Safety controls in code:
  # SELECT-only first-token check, forbidden-keyword regex, READ ONLY transaction
  # wrapping, Role.ADMIN gate at the route. CodeQL cannot see these runtime guards.
  - "apps/mybookkeeper/backend/app/repositories/db_admin_repo.py"
  #
  # apps/mybookkeeper/backend/app/services/user/hibp_service.py — SHA1 is the
  # wire-format mandated by HIBP's k-anonymity range API protocol. Plaintext password
  # is hashed locally for protocol compliance and never leaves the server (only the
  # 5-char hash prefix does). Actual password storage uses argon2.
  - "apps/mybookkeeper/backend/app/services/user/hibp_service.py"
  #
  # apps/mygamingassistant/backend/app/services/wow/server_status_client.py and
  # apps/mygamingassistant/backend/app/api/wow_server_status.py — log-injection
  # findings on the `region` parameter. `region` is validated against ALLOWED_REGIONS
  # (a frozenset of {"us", "eu", "kr", "tw"} — four 2-char ASCII codes) before any
  # log call in both files. CRLF injection is impossible through values from that set.
  # The runtime allowlist check is a data-flow guard that CodeQL cannot see.
  # Sanitizing log args at call sites is explicitly prohibited by this project's
  # engineering rules (see rules/global-preferences.md).
  - "apps/mygamingassistant/backend/app/services/wow/server_status_client.py"
  - "apps/mygamingassistant/backend/app/api/wow_server_status.py"
